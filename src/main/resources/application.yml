spring:
  application:
    name: laforesta-api

  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/laforesta
    username: laforesta_user
    password: laforesta_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  web:
    error:
      include-stacktrace: never
      include-message: always
      include-binding-errors: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  mail:
    from: ${MAIL_USERNAME}
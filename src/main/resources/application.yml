spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: laforesta-api

  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/laforesta
    username: laforesta_user
    password: laforesta_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    default-encoding: UTF-8
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  web:
    error:
      include-stacktrace: never
      include-message: always
      include-binding-errors: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3001}

  mail:
    from: ${MAIL_USERNAME}
    retry:
      max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${MAIL_RETRY_DELAY_MS:1000}